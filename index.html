<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./social-links-profile-main/style.css">
  <title>Frontend Mentor | Social links profile</title>

<body>
  <main>
      <article class="social-link-card">

          <img src="./social-links-profile-main/assets/images/avatar-jessica.jpeg" alt="profile picture" id="profile-pic">
          <h1>Jessica Randall</h1>
           <h5 id="address-para">London, United Kingdom</h2>
        </div>
        <p id="designation">"Front-end developer and avid reader."</p>
        <div class="social-links">
